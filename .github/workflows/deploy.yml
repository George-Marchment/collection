name: Build and deploy site

on:
  push:
    branches:
      - main
  workflow_dispatch:  # lets you re-run it by hand from the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Covers fetched on GitHub (for albums with no file in covers/ yet) are kept
      # here between runs so they aren't downloaded again every time.
      - name: Restore downloaded covers
        uses: actions/cache@v4
        with:
          path: .cover-cache
          key: covers-${{ github.run_id }}
          restore-keys: covers-

      - name: Build site
        run: python script.py --output _site --fetch-dir .cover-cache

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
